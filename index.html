<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ligentia USA — Treasury Report</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700&family=DM+Mono:wght@400;500&display=swap');
:root{--navy:#0D2233;--teal:#1A6B72;--green:#00A651;--slate:#2D3E50;--border:#DDE4EC;
  --text:#1C2B3A;--sub:#6B7F91;--white:#FFFFFF;--red:#B03A2E;--amber:#C97B2E;--bg:#F4F7FA}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;padding:24px}
.gate{width:100%;max-width:412px}
.brand{display:flex;justify-content:center;margin-bottom:26px}
.brand img{height:44px;display:block}
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:28px 28px 24px}
h1{margin:0 0 5px;font-size:16px;font-weight:600;color:var(--navy);letter-spacing:-.01em}
.sub{margin:0 0 22px;font-size:12.5px;color:var(--sub);line-height:1.6}
label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin-bottom:7px}
.row{display:flex;gap:9px}
input{flex:1 1 auto;min-width:0;font-family:'DM Mono',monospace;font-size:14px;letter-spacing:.06em;
  padding:11px 13px;border:1px solid var(--border);border-radius:9px;background:var(--white);color:var(--text)}
input:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:var(--teal)}
button{appearance:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;
  padding:11px 20px;border-radius:9px;border:1px solid var(--navy);background:var(--navy);color:var(--white);flex:none}
button:hover{opacity:.88}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.5;cursor:not-allowed}
.msg{margin-top:15px;padding:10px 13px;border-radius:8px;font-size:12.5px;display:none;line-height:1.55}
.msg.show{display:block}
.msg.err{background:#F7E4E1;border:1px solid #EBC8C3;color:#8A2C22}
.msg.busy{background:#E1EFF0;border:1px solid #C4DEE0;color:#12545A}
.foot{margin-top:20px;padding-top:17px;border-top:1px solid var(--border);font-size:11.5px;color:var(--sub);line-height:1.65}
.foot b{color:var(--slate);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="card">
    <h1>Treasury report</h1>
    <p class="sub">Cash position, receivables and payables. Enter the access code to open the report.</p>
    <label for="pw">Access code</label>
    <div class="row">
      <input type="password" id="pw" autocomplete="current-password" spellcheck="false" autofocus>
      <button id="go">Open</button>
    </div>
    <div class="msg" id="msg"></div>
    <p class="foot">The report is stored encrypted. Without the code there is nothing to read in this page or in the file beside it &mdash; <b>the content itself is scrambled, not merely hidden.</b></p>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const ITER=250000, FILE="report.enc";
function say(cls,t){ const m=$("msg"); m.className="msg show "+cls; m.textContent=t; }
function clear(){ $("msg").className="msg"; }

async function unlock(){
  const pw=$("pw").value;
  if(!pw){ say("err","Enter the access code."); $("pw").focus(); return; }
  $("go").disabled=true;
  say("busy","Decrypting\u2026");
  let raw;
  try{
    const res=await fetch(FILE,{cache:"no-store"});
    if(!res.ok) throw new Error("http "+res.status);
    const b64=(await res.text()).trim();
    raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  }catch(e){
    $("go").disabled=false;
    say("err","Could not load "+FILE+". It must sit in the same folder and be served over http, for example GitHub Pages. Opening this file straight from disk will not work.");
    return;
  }
  try{
    const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},
      km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
    const html=new TextDecoder().decode(pt);
    // hand the whole document over; nothing this page declared survives, so the
    // report's own script runs in a clean global scope
    document.open(); document.write(html); document.close();
  }catch(e){
    $("go").disabled=false;
    say("err","That code did not work. Check for stray spaces \u2014 the code is case sensitive.");
    $("pw").select();
  }
}
$("go").addEventListener("click",unlock);
$("pw").addEventListener("keydown",e=>{ if(e.key==="Enter") unlock(); });
$("pw").addEventListener("input",clear);
if(!window.crypto||!window.crypto.subtle){
  say("err","This browser cannot decrypt the report. It needs a current browser on a secure (https) address.");
  $("go").disabled=true;
}
})();
</script>
